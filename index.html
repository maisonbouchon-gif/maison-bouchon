:root{

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;

}

.brand-t{display:flex;flex-direction:column;line-height:1.1}
.brand h1{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:22px;text-transform:uppercase;letter-spacing:.16em}
.brand small{font-size:10.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);font-weight:600;margin-top:2px}
@media (max-width:420px){.brand h1{font-size:18px;letter-spacing:.12em}.brand .mark{width:38px;height:38px}}
.stripe{height:5px;background:repeating-linear-gradient(-45deg,var(--hi) 0 10px,var(--ink) 10px 20px);opacity:.9}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.tab .sm{display:none}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab:focus-visible,.btn:focus-visible,.icon-btn:focus-visible,.chip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 110px;display:flex;flex-direction:column;gap:24px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:500}

/* Section heads */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:22px}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn svg,.icon-btn svg{width:16px;height:16px;flex:none}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:7px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.edit{cursor:pointer}
.kpi.edit:hover .v{color:var(--accent)}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:first-child{grid-column:1/-1}.kpi .v{font-size:25px}}

/* Budget gauge */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.gauge{position:relative;height:30px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.gauge .g-eng{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);border-right:2px solid var(--accent)}
.gauge .g-dep{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.gauge .g-over{position:absolute;inset:0 0 0 auto;background:repeating-linear-gradient(-45deg,var(--bad) 0 6px,var(--bad-soft) 6px 12px)}
.meter{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.meter-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meter-h b{font-family:var(--display);font-size:22px}
.meter-bar{height:22px;border-radius:7px;background:var(--surface-2);overflow:hidden;display:flex}
.meter-bar span{height:100%}
.meter-c{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:12px}
.src{display:flex;flex-direction:column;gap:5px;min-width:0}
.src .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}
.src .s{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.srcs{grid-template-columns:1fr 1fr;gap:14px}.src .v{font-size:20px}}
.scan{font-size:13px;border-radius:9px;padding:9px 11px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.scan.ok{background:var(--ok-soft);color:var(--ok)}
.scan.warn{background:var(--warn-soft);color:var(--warn)}
.drop{border:1.5px dashed var(--accent);border-radius:11px;padding:12px;background:var(--accent-soft);display:flex;flex-direction:column;gap:6px}
.drop label{color:var(--accent)!important;font-size:13.5px!important}
.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
@media (max-width:860px){.grid-2{grid-template-columns:1fr}}

/* Theme rows (dashboard) */
.trows{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .n{font-weight:600}
.trow .a{font-size:13px;color:var(--muted);text-align:right}
.bar{grid-column:1/-1;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.bar .dep{background:var(--accent)}
.bar .rest{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.bar.over .dep{background:var(--bad)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-mute{background:var(--surface-2);color:var(--muted)}
.c-acc{background:var(--accent-soft);color:var(--accent)}
.chip-btn{border:0;cursor:pointer}
.chip-sel{position:relative;display:inline-flex;align-items:center;border-radius:999px;font-size:12px;font-weight:600}
.chip-sel::before{content:"";position:absolute;left:9px;width:6px;height:6px;border-radius:50%;background:currentColor;pointer-events:none}
.chip-sel::after{content:"";position:absolute;right:9px;width:5px;height:5px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:translateY(-2px) rotate(45deg);pointer-events:none}
.chip-sel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:inherit;font:inherit;padding:3px 24px 3px 20px;border-radius:999px;cursor:pointer}
.chip-sel select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip-sel option{color:var(--ink);background:var(--surface)}

/* Budget themes */
.themes{display:flex;flex-direction:column;gap:10px}
.theme{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.theme-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:14px 16px;cursor:pointer;align-items:center}
.theme-h:hover{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.theme-h h3{font-size:20px;display:flex;align-items:center;gap:8px}
.theme-h h3 .caret{width:16px;height:16px;transition:transform .15s;color:var(--muted)}
.theme[data-open="true"] .caret{transform:rotate(90deg)}
.theme-h .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.figs{display:flex;gap:18px;text-align:right}
.fig small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.fig b{font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.theme-h .bar{height:5px}
@media (max-width:560px){.theme-h{grid-template-columns:1fr}.figs{justify-content:space-between;text-align:left}}
.theme-b{border-top:1px solid var(--line);padding:6px 16px 16px;display:flex;flex-direction:column;gap:14px}
.sub-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.sub-h .eyebrow b{color:var(--ink)}
.lines{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;padding:10px 12px;align-items:center;background:var(--surface)}
.line+.line{border-top:1px solid var(--line)}
.line .t{font-weight:600;overflow-wrap:anywhere}
.line .d{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.line .m{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.line .m small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.line.refused .t,.line.refused .m{opacity:.55;text-decoration:line-through}
.empty{color:var(--muted);font-size:13.5px;padding:12px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.theme-f{display:flex;justify-content:flex-end;gap:8px}
a.file{color:var(--accent);display:inline-flex;align-items:center;gap:3px;font-weight:600;text-decoration:none}
a.file:hover{text-decoration:underline}
a.file svg{width:13px;height:13px}

/* Étapes */
.steps{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.step{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:center}
.step+.step{border-top:1px solid var(--line)}
.step .idx{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;background:var(--surface-2);color:var(--muted)}
.step.encours .idx{background:var(--hi);color:var(--hi-ink)}
.step.termine .idx{background:var(--ok);color:var(--surface)}
.step .t{font-weight:600}
.step.termine .t{color:var(--muted)}
.step .d{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.step .r{display:flex;align-items:center;gap:4px}
.pbar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
.pbar i{display:block;height:100%;background:var(--ok)}
.step .notes{grid-column:2/-1;font-size:13px;color:var(--muted);white-space:pre-wrap}
@media (max-width:560px){.step{grid-template-columns:30px minmax(0,1fr)}.step .idx{width:26px;height:26px;font-size:14px}.step .r{grid-column:2;justify-content:flex-start;flex-wrap:wrap}}
.progress-big{display:flex;align-items:center;gap:14px}
.progress-big .ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.progress-big .ring span{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px}
.next-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.next-list li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:520px;max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.sheet-h h2{font-size:22px}
form.f{display:flex;flex-direction:column;gap:12px;padding:8px 18px 18px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.rep{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.rep[hidden]{display:none}
.rep-l{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;font-size:14px}
.rep .hint{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:9px;flex-wrap:wrap}
.seg label{flex:1;text-align:center;padding:6px 8px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);min-width:80px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--ink)}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.f-actions{display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.f-actions .btn-row{margin-left:auto}
.err{color:var(--bad);font-size:13px;font-weight:500}
input[type=range]{accent-color:var(--ok);padding:0!important;background:transparent!important;border:0!important}

@media (max-width:640px){
  .top-in{padding-bottom:12px}
  .tabs{position:fixed;left:0;right:0;bottom:0;border-radius:0;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:30;justify-content:space-around}
  .tab{flex:1;padding:10px 4px;font-size:13px}
  .tab .lg{display:none}.tab .sm{display:inline}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:16px 16px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.menu-btn{margin-left:-6px}
.payers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.payer{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.payer b{font-family:var(--display);font-size:24px;font-weight:700}
.payer .s{font-size:12px;color:var(--muted)}
.payer.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.payer:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){.payers{grid-template-columns:1fr 1fr}.payer b{font-size:20px}}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchip{background:var(--surface-2);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.fchip.on{background:var(--accent);color:var(--accent-ink)}
.month{display:flex;flex-direction:column;gap:6px}
.menu-btn svg{width:22px;height:22px}
body.logged-out .tabs,body.logged-out .menu-btn{display:none}
.login{max-width:380px;margin:8vh auto 0;display:flex;flex-direction:column;gap:10px;align-items:stretch}

<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="mark" role="img" aria-label="Logo Maison Bouchon"></span><div class="brand-t"><h1>Maison Bouchon</h1><small>Suivi de chantier</small></div></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-accueil" data-tab="accueil"><span class="lg">Tableau de bord</span><span class="sm">Accueil</span></button>
      <button class="tab" role="tab" id="tab-budget" data-tab="budget">Budget</button>
      <button class="tab" role="tab" id="tab-depenses" data-tab="depenses">Dépenses</button>
      <button class="tab" role="tab" id="tab-travaux" data-tab="travaux">Travaux</button>
    </nav>
    <button class="icon-btn menu-btn" data-action="menu" aria-label="Compte et options"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
  </div>
  <div class="stripe" aria-hidden="true"></div>
</header>
<main id="app"></main>
<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(function(){
"use strict";
const ICON = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
  caret:'<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11l-8.5 8.5a5 5 0 01-7-7L14 4a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 7"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const DEVIS_STATUT = {
  accepte:{label:"Signé",cls:"c-ok"},
  attente:{label:"À l'étude",cls:"c-warn"},
  refuse:{label:"Refusé",cls:"c-mute"}
};
const ETAPE_STATUT = {
  afaire:{label:"À faire",cls:"c-mute"},
  encours:{label:"En cours",cls:"c-warn"},
  termine:{label:"Terminé",cls:"c-ok"}
};
const COLLS = ["themes","devis","depenses","etapes"];
const SOURCES = {
  emprunt:{label:"Prêt",short:"Prêt"},
  apportPret:{label:"Apport prêt par Fanette",short:"Apport prêt Fanette"},
  apportSupF:{label:"Apport supplémentaire Fanette",short:"Apport supp. Fanette"},
  apportSupY:{label:"Apport supplémentaire Yohan",short:"Apport supp. Yohan"},
  apportSup50:{label:"Apport supplémentaire 50/50",short:"Apport supp. 50/50",split:{apportSupF:.5,apportSupY:.5}},
  multi:{label:"Répartir entre plusieurs payeurs",short:"Réparti",multi:true},
  apportSup:{label:"Apport supplémentaire (à répartir)",short:"Apport supp. à répartir",legacy:true}
};
// L'ancienne enveloppe « apport supplémentaire » n'apparaît que tant qu'elle sert encore.
const legacyUsed = k => (Number(state.settings[k])||0)>0 || state.depenses.some(x=>x.source===k);
const srcList = keep => Object.entries(SOURCES).filter(([k,v])=>!v.legacy || k===keep || legacyUsed(k));
const srcOptions = sel => `<option value="">Non précisé</option>`+srcList(sel).map(([k,o])=>`<option value="${k}" ${k===sel?"selected":""}>${o.label}</option>`).join("");
// Une source « split » n'a pas d'enveloppe : son montant est réparti sur celles de Fanette et Yohan.
// « multi » : montants libres par enveloppe, stockés dans x.repartition {cle: montant}.
const envList = () => srcList().filter(([k,v])=>!v.split&&!v.multi);
const shareOf = (x,k) => { const n=Number(x.montant)||0; if(x.source===k) return n;
  if(x.source==="multi") return Number((x.repartition||{})[k])||0; const sp=SOURCES[x.source]&&SOURCES[x.source].split; return sp&&sp[k]?n*sp[k]:0; };
const repList = () => envList().filter(([k,v])=>!v.legacy);
const repText = x => Object.entries(x.repartition||{}).filter(([k,n])=>n>0&&SOURCES[k]).map(([k,n])=>`${SOURCES[k].short} ${fmt0(n)}`).join(" · ");
const srcChip = x => x.source==="multi"?`<span class="chip c-mute">Réparti : ${esc(repText(x))}</span>`:SOURCES[x.source]?`<span class="chip c-mute">${SOURCES[x.source].short}</span>`:"";
const repartHTML = x => { const on = x&&x.source==="multi", rp=(x&&x.repartition)||{};
  return `<div id="f-rep" class="rep" ${on?"":"hidden"}><span class="eyebrow">Répartition du montant</span>
    ${repList().map(([k,o])=>`<div class="rep-l"><label for="f-rep-${k}">${o.label}</label><input id="f-rep-${k}" name="rep-${k}" data-rep inputmode="decimal" placeholder="0" value="${rp[k]?String(rp[k]).replace(".",","):""}"></div>`).join("")}
    <div class="hint num" id="f-rep-s"></div></div>`; };
function wireRepart(f){
  const src=f.elements.source, box=f.querySelector("#f-rep"), out=f.querySelector("#f-rep-s"); if(!src||!box) return;
  const upd=()=>{ box.hidden = src.value!=="multi"; if(box.hidden) return; f.querySelector("#m-err").hidden=true;
    const mt=parseAmount(val(f,"montant"))||0, t=[...box.querySelectorAll("[data-rep]")].reduce((a,i)=>a+(parseAmount(i.value)||0),0), d=Math.round((mt-t)*100)/100;
    out.innerHTML = `Réparti ${fmt2(t)} sur ${fmt2(mt)} · ${d===0?"<b style=\"color:var(--ok)\">tout est réparti</b>":d>0?`reste ${fmt2(d)} à répartir`:`<b style="color:var(--bad)">${fmt2(-d)} de trop</b>`}`; };
  f.addEventListener("input",upd); src.addEventListener("change",upd); upd();
}
function readRepart(f,obj){
  if(obj.source!=="multi"){ delete obj.repartition; return true; }
  const rp={}; let t=0;
  for(const [k] of repList()){ const raw=val(f,"rep-"+k); if(raw==="") continue; const n=parseAmount(raw); if(n==null||n<0) return fail(f,"Montant illisible pour « "+SOURCES[k].label+" »."); if(n>0){ rp[k]=n; t+=n; } }
  if(Math.abs(t-obj.montant)>0.005) return fail(f,`La répartition (${fmt2(t)}) doit être égale au montant payé (${fmt2(obj.montant)}).`);
  obj.repartition=rp; return true;
}
const paidFor = (list,k) => list.reduce((a,x)=>a+shareOf(x,k),0);
const budgetOf = st => { const t = Object.keys(SOURCES).reduce((a,k)=>a+(Number(st[k])||0),0); return t || Number(st.budget)||0; };

const state = {themes:[],devis:[],depenses:[],etapes:[],settings:{budget:0}, ready:false};
let sb = null, assets = true, readOnly = false, offline = false, session = null;
let tab = "accueil";
const open = new Set();

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur0 = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur2 = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:0,maximumFractionDigits:2});
const fmt0 = n => eur0.format(Math.round(n||0));
const fmt2 = n => eur2.format(n||0);
const sum = (arr,k="montant") => arr.reduce((a,x)=>a+(Number(x[k])||0),0);
const parseAmount = s => { if(s==null) return null; const t=String(s).replace(/[\s  €]/g,"").replace(",","."); if(t==="") return null; const n=Number(t); return isFinite(n)?n:null; };
const fdate = iso => { if(!iso) return ""; const d=new Date(iso+"T12:00:00"); return isNaN(d)?"":d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}); };
const today = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const byOrder = (a,b) => (a.ordre??0)-(b.ordre??0) || String(a.nom||"").localeCompare(String(b.nom||""),"fr");
const themeName = id => (state.themes.find(t=>t.id===id)||{}).nom || "Sans thème";
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2400); }

/* ---------- store (Supabase) ---------- */
function applyRow(coll,id,data,deleted){
  if(coll==="settings"){ if(id==="main") state.settings = deleted?{}:Object.assign({},data); return; }
  if(!state[coll]) return;
  const list = state[coll]; const i=list.findIndex(x=>x.id===id);
  if(deleted){ if(i>=0) list.splice(i,1); return; }
  const row = Object.assign({},data,{id}); if(i>=0) list[i]=row; else list.push(row);
}
async function save(coll,id,obj){
  obj.maj = new Date().toISOString();
  const data = Object.assign({},obj); delete data.id;
  const {error} = await sb.from("docs").upsert({coll,id,data,maj:obj.maj});
  if(error){ handleErr(error); throw error; }
  applyRow(coll,id,data,false); render();
}
async function remove(coll,id){
  const {error} = await sb.from("docs").delete().match({coll,id});
  if(error){ handleErr(error); throw error; }
  applyRow(coll,id,null,true); render();
}
async function saveSettings(obj){ await save("settings","main",obj); }
function handleErr(e){
  console.error(e);
  if(!navigator.onLine) toast("Pas de connexion : réessayez quand le réseau revient.");
  else if(e && (e.code==="42501"||/row-level security|permission/i.test(e.message||""))) toast("Ce compte n'a pas le droit de modifier.");
  else toast("Enregistrement impossible, réessayez.");
}

/* ---------- stats ---------- */
function themeStats(tid){
  const dv = state.devis.filter(d=>d.themeId===tid);
  const dp = state.depenses.filter(d=>d.themeId===tid);
  const engage = sum(dv.filter(d=>d.statut==="accepte"));
  const attente = sum(dv.filter(d=>d.statut==="attente"));
  const depense = sum(dp);
  return {dv,dp,engage,attente,depense,reste:Math.max(engage-depense,0),projection:Math.max(engage,depense),previsionnel:Math.max(engage+attente,depense),over:depense>engage&&engage>0};
}
function totals(){
  let engage=0,attente=0,depense=0,reste=0,projection=0,previsionnel=0;
  const ids = new Set(state.themes.map(t=>t.id));
  state.devis.concat(state.depenses).forEach(x=>{ if(!ids.has(x.themeId)) ids.add(x.themeId); });
  ids.forEach(id=>{ const s=themeStats(id); engage+=s.engage; attente+=s.attente; depense+=s.depense; reste+=s.reste; projection+=s.projection; previsionnel+=s.previsionnel; });
  return {engage,attente,depense,reste,projection,previsionnel};
}
function avancement(){
  const e = state.etapes; if(!e.length) return 0;
  return Math.round(e.reduce((a,x)=>a+(x.statut==="termine"?100:(Number(x.avancement)||0)),0)/e.length);
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  const app = document.getElementById("app");
  let html = "";
  if(offline) html += `<div class="banner">Hors ligne : les données affichées peuvent ne pas être à jour.</div>`;
  if(!state.ready) html += `<div class="empty">Chargement…</div>`;
  else html += tab==="budget"?viewBudget():tab==="depenses"?viewDepenses():tab==="travaux"?viewTravaux():viewAccueil();
  app.innerHTML = html;
}
const canEdit = () => !readOnly;
const btn = (action,label,cls="",attrs="") => canEdit()?`<button class="btn ${cls}" data-action="${action}" ${attrs}>${label}</button>`:"";

  </section>

  <section class="panel">

function financementHTML(t){
  const st = state.settings;
  const paidBy = k => paidFor(state.depenses,k);
  const unassigned = sum(state.depenses.filter(x=>!SOURCES[x.source]));
  const cells = envList().map(([k,v])=>{
    const m = Number(st[k])||0, p = paidBy(k), r = m-p;
    return `<div class="src"><span class="eyebrow">${v.label}</span><span class="v num">${m?fmt0(m):"–"}</span>
      <div class="bar ${r<0?"over":""}"><span class="dep" style="width:${m?Math.min(p/m,1)*100:0}%"></span></div>
      <span class="s num">Utilisé ${fmt0(p)} · ${r<0?`<b style="color:var(--bad)">dépassé de ${fmt0(-r)}</b>`:`reste ${fmt0(r)}`}</span></div>`;
  }).join("");
  return `<section class="panel">
    <div class="sec-head"><div><h2>Financement</h2><p>${budgetOf(st)?`Total ${fmt0(budgetOf(st))}`:"Saisissez le prêt et les apports pour suivre ce qu'il reste sur chacun"}${unassigned?` · ${fmt0(unassigned)} payés sans source indiquée`:""}</p></div>${btn("edit-budget",ICON.edit+"Modifier","small")}</div>

}
function meterHTML(title,pct,segs,scale,caption){
  return `<div class="meter"><div class="meter-h"><span class="eyebrow">${title}</span><b class="num">${pct}</b></div>
    <div class="meter-bar">${segs.filter(x=>x.w>0).map(x=>`<span style="width:${x.w/scale*100}%;background:${x.hatch?`repeating-linear-gradient(-45deg,${x.c} 0 6px,var(--bad-soft) 6px 12px)`:x.c};${x.ring?"box-shadow:inset 0 0 0 1.5px var(--accent);":""}"></span>`).join("")}</div>
    <div class="meter-c num">${caption}</div></div>`;
}
function barHTML(s){
  const tot = Math.max(s.projection,1);
  return `<div class="bar ${s.over?"over":""}"><span class="dep" style="width:${Math.min(s.depense,tot)/tot*100}%"></span><span class="rest" style="width:${s.reste/tot*100}%"></span></div>`;
}

function fileLink(x){ return x.fileId?`<a class="file" href="#" data-file="${esc(x.fileId)}">${ICON.clip}${esc(x.fileName||"Fichier")}</a>`:""; }
async function openFile(path){
  const w = window.open("","_blank");

const paidOn = d => sum(state.depenses.filter(x=>x.devisId===d.id));
const isPaid = d => d.statut==="accepte" && (Number(d.montant)||0)>0 && paidOn(d) >= (Number(d.montant)||0)-0.5;
const STATUT_MENU = [["accepte","Signé"],["partiel","Payé partiellement"],["paye","Payé"],["attente","À l'étude"],["refuse","Refusé"]];
function devisLine(d){

let payeur = "tous";
function viewDepenses(){
  const all = state.depenses.slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||String(b.maj||"").localeCompare(String(a.maj||"")));
  const total = sum(all);
  const groups = srcList().map(([k,v])=>({k,label:v.label,split:!!v.split,multi:!!v.multi,list:all.filter(x=>shareOf(x,k)>0||x.source===k)}));
  const none = all.filter(x=>!SOURCES[x.source]);
  if(none.length) groups.push({k:"aucun",label:"Non précisé",list:none});
  const cards = groups.map(g=>{
    if(g.multi){ const p=sum(g.list); return `<button class="payer ${payeur===g.k?"on":""}" data-action="payeur" data-k="${g.k}">
      <span class="eyebrow">Réparti entre plusieurs</span><b class="num">${fmt0(p)}</b>
      <span class="s num">${g.list.length} dépense${g.list.length>1?"s":""} · comptées dans chaque enveloppe selon la répartition</span></button>`; }
    const p = g.k==="aucun"||g.split?sum(g.list):paidFor(g.list,g.k), env = g.split?0:Number(state.settings[g.k])||0;
    const detail = g.split?(p?` · ${fmt0(p/2)} chacun, compté pour Fanette et Yohan`:" · compté moitié Fanette, moitié Yohan"):`${env?` · reste ${fmt0(env-p)} sur ${fmt0(env)}`:""}${total?` · ${Math.round(p/total*100)} %`:""}`;
    return `<button class="payer ${payeur===g.k?"on":""}" data-action="payeur" data-k="${g.k}">
      <span class="eyebrow">${esc(g.label)}</span><b class="num">${fmt0(p)}</b>
      <span class="s num">${g.list.length} dépense${g.list.length>1?"s":""}${detail}</span></button>`;
  }).join("");
  const g0 = groups.find(g=>g.k===payeur);
  const shown = payeur==="tous"||!g0?all:g0.list;
  const byMonth = {};
  shown.forEach(x=>{ const m=(x.date||"").slice(0,7)||"sans-date"; (byMonth[m]=byMonth[m]||[]).push(x); });
  const monthName = m => m==="sans-date"?"Sans date":new Date(m+"-15T12:00:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  return `
  <div class="sec-head">
    <div><h2>Dépenses</h2><p class="num">${all.length} dépense${all.length>1?"s":""} · ${fmt0(total)} payés au total</p></div>
    ${btn("new-depense",ICON.plus+"Dépense","primary")}
  </div>
  <section class="payers">${cards}</section>
  <div class="filters"><button class="chip-btn fchip ${payeur==="tous"?"on":""}" data-action="payeur" data-k="tous">Tout voir</button>${groups.map(g=>`<button class="chip-btn fchip ${payeur===g.k?"on":""}" data-action="payeur" data-k="${g.k}">${esc(SOURCES[g.k]?SOURCES[g.k].short:g.label)}</button>`).join("")}</div>
  ${shown.length?Object.keys(byMonth).map(m=>`<div class="month"><div class="sub-h"><span class="eyebrow">${monthName(m)}</span><span class="eyebrow num"><b>${fmt0(sum(byMonth[m]))}</b></span></div>
    <div class="lines">${byMonth[m].map(depRow).join("")}</div></div>`).join(""):`<div class="empty">Aucune dépense pour ce payeur.</div>`}`;
}
function depRow(x){
  const dv = x.devisId && state.devis.find(d=>d.id===x.devisId);
  return `<div class="line">
    <div><div class="t">${esc(x.libelle||"Dépense")}</div>
    <div class="d">${x.date?`<span>${fdate(x.date)}</span>`:""}<span>${esc(themeName(x.themeId))}</span>${dv?`<span class="chip c-acc">Devis ${esc(dv.entreprise||"")}</span>`:""}${fileLink(x)}</div>
    <div class="d" style="margin-top:4px">${canEdit()?`<span class="chip-sel ${SOURCES[x.source]?"c-acc":"c-warn"}"><select data-change="dep-source" data-id="${x.id}" aria-label="Payé par">${srcOptions(x.source||"")}</select></span>`:`<span class="chip c-mute">${esc(SOURCES[x.source]?SOURCES[x.source].short:"Non précisé")}</span>`}${x.source==="multi"?`<span class="s num">${esc(repText(x))}</span>`:""}</div></div>
    <div class="m">${fmt2(x.montant)}</div>

}
function viewTravaux(){
  const list = state.etapes.slice().sort(byOrder); const av = avancement();
  return `

function etapeRow(e,i,n){
  const st = ETAPE_STATUT[e.statut]||ETAPE_STATUT.afaire;
  const pct = e.statut==="termine"?100:(Number(e.avancement)||0);
  const dates = e.debut||e.fin ? `${e.debut?fdate(e.debut):"?"} → ${e.fin?fdate(e.fin):"?"}` : "";
  return `<div class="step ${e.statut||"afaire"}">
    <span class="idx">${i+1}</span>
    <div><div class="t">${esc(e.nom)}</div>
      <div class="d">${e.statut==="encours"?`<span class="pbar"><i style="width:${pct}%"></i></span><span>${pct}%</span>`:""}${dates?`<span>${dates}</span>`:""}${e.themeId?`<span>${esc(themeName(e.themeId))}</span>`:""}</div></div>
    <div class="r">
      ${canEdit()?`<button class="chip chip-btn ${st.cls}" data-action="cycle" data-id="${e.id}" title="Changer le statut">${st.label}</button>
      <button class="icon-btn" data-action="move" data-dir="-1" data-id="${e.id}" aria-label="Monter" ${i===0?"disabled style='opacity:.3'":""}>${ICON.up}</button>
      <button class="icon-btn" data-action="move" data-dir="1" data-id="${e.id}" aria-label="Descendre" ${i===n-1?"disabled style='opacity:.3'":""}>${ICON.down}</button>
      <button class="icon-btn" data-action="edit-etape" data-id="${e.id}" aria-label="Modifier l'étape">${ICON.edit}</button>`:`<span class="chip ${st.cls}">${st.label}</span>`}
    </div>
    ${e.notes?`<div class="notes">${esc(e.notes)}</div>`:""}
  </div>`;
}

/* ---------- modal forms ---------- */
let current = null;
function openModal(title,body,onSubmit,onDelete){
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="sheet-h"><h2 id="m-title">${esc(title)}</h2><button class="icon-btn" data-close="1" aria-label="Fermer">${ICON.x}</button></div>
    <form class="f" id="m-form" novalidate>${body}
      <div class="err" id="m-err" hidden></div>
      <div class="f-actions">${onDelete?`<button type="button" class="btn danger" id="m-del">Supprimer</button>`:""}
      <div class="btn-row"><button type="button" class="btn" data-close="1">Annuler</button><button type="submit" class="btn primary" id="m-ok">Enregistrer</button></div></div>
    </form></div></div>`;
  current = {onSubmit,onDelete};
  const form = document.getElementById("m-form");
  form.addEventListener("submit",async ev=>{
    ev.preventDefault();
    const err = document.getElementById("m-err"); err.hidden=true;
    const ok = document.getElementById("m-ok"); ok.disabled=true; ok.textContent="Enregistrement…";
    try{
      const res = await onSubmit(form);
      if(res===false){ ok.disabled=false; ok.textContent="Enregistrer"; return; }
      closeModal(); toast("Enregistré");
    }catch(e){ ok.disabled=false; ok.textContent="Enregistrer"; if(e && e.userMsg){ err.textContent=e.userMsg; err.hidden=false; } }
  });
  const del = document.getElementById("m-del");
  if(del) del.addEventListener("click",async()=>{
    if(!del.dataset.confirm){ del.dataset.confirm="1"; del.textContent="Confirmer la suppression"; return; }
    const msg = onDelete.check && onDelete.check();
    if(msg){ const err=document.getElementById("m-err"); err.textContent=msg; err.hidden=false; return; }
    del.disabled=true;
    try{ await onDelete(); closeModal(); toast("Supprimé"); }catch(e){ del.disabled=false; }
  });
  setTimeout(()=>{ const f=form.querySelector("input:not([type=radio]):not([type=file]),select"); if(f && window.matchMedia("(min-width:641px)").matches) f.focus(); },30);
}

let pdfReady = null;
function loadScript(src){ return new Promise((res,rej)=>{ const el=document.createElement("script"); el.src=src; el.onload=res; el.onerror=()=>rej(new Error("script")); document.head.appendChild(el); }); }
function loadPdf(){
  if(!pdfReady){
    const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    pdfReady = (async()=>{ await loadScript(base+"pdf.worker.min.js"); await loadScript(base+"pdf.min.js"); window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js"; return window.pdfjsLib; })();
    pdfReady.catch(()=>{ pdfReady=null; });
  }
  return pdfReady;
}
async function readPdf(file){
  const lib = await loadPdf();
  const doc = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  let text="";
  for(let p=1;p<=Math.min(doc.numPages,5);p++){
    const tc = await (await doc.getPage(p)).getTextContent();
    text += tc.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("")+"\n";
  }
  let image=null;
  if(text.replace(/\s/g,"").length<80){ // PDF scanné : on envoie une image de la 1re page
    const page = await doc.getPage(1); const vp = page.getViewport({scale:2});
    const c = document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    image = await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  }
  return {text:text.slice(0,30000),image};
}
const num = s => { if(s==null) return null; const t=String(s).replace(/[\s  €]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."); const n=parseFloat(t); return isFinite(n)?n:null; };
function guessFromText(text){
  const lines = text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const amt = /(\d{1,3}(?:[   .]\d{3})*(?:[.,]\d{2})|\d+(?:[.,]\d{2}))/g;
  let ttc=null;
  for(const re of [/net\s*à\s*payer/i,/total\s*t\.?t\.?c/i,/montant\s*t\.?t\.?c/i,/\bt\.?t\.?c\b/i]){
    for(let i=lines.length-1;i>=0&&ttc==null;i--){ if(re.test(lines[i])){ const m=(lines[i]+" "+(lines[i+1]||"")).match(amt); if(m){ const v=num(m[0]); if(v) ttc=v; } } }
    if(ttc!=null) break;
  }
  const ent = lines.find(l=>/[a-z]/i.test(l) && !/^(devis|facture|date|page|n[°o]|client|réf)/i.test(l) && l.length<60);
  const d = text.match(/(\d{2})[\/.-](\d{2})[\/.-](20\d{2})/);
  return {entreprise:ent||"",montant_ttc:ttc,date:d?`${d[3]}-${d[2]}-${d[1]}`:null,objet:"",theme:null};
}
function toBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(file); }); }
async function extract(file,kind){
  const isPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name);
  const mediaType = isPdf?"application/pdf":(file.type||"image/jpeg");
  if(file.size <= 20*1024*1024 && (isPdf || /^image\/(jpeg|png|gif|webp)$/.test(mediaType))){
    try{
      const {data,error} = await sb.functions.invoke("lire-devis",{body:{kind,themes:state.themes.map(t=>t.nom),mediaType,data:await toBase64(file)}});
      if(!error && data && !data.error) return {src:"claude",entreprise:String(data.entreprise||""),objet:String(data.objet||""),montant_ttc:num(data.montant_ttc),montant_ht:num(data.montant_ht),date:/^\d{4}-\d{2}-\d{2}$/.test(data.date||"")?data.date:null,theme:data.theme||null};
    }catch(e){ console.warn(e); }
  }
  if(isPdf){ const {text} = await readPdf(file); if(text.replace(/\s/g,"").length>=20) return Object.assign({src:"texte"},guessFromText(text)); }
  return null;
}
function wireAutofill(form,kind,isNew){
  const inp = form.elements.file; if(!inp) return;
  inp.addEventListener("change",async()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const box = form.querySelector("#f-scan"); box.hidden=false; box.className="scan"; box.textContent="Lecture du document…";
    let r=null; try{ r = await extract(f,kind); }catch(e){ r=null; }
    if(!r || (r.montant_ttc==null && r.montant_ht==null && !r.entreprise)){ box.className="scan warn"; box.textContent="Impossible de lire ce document automatiquement. Saisissez les champs à la main."; return; }
    const set = (n,v) => { const el=form.elements[n]; if(el && v!=null && v!=="") el.value=v; };
    const amount = r.montant_ttc!=null?r.montant_ttc:r.montant_ht;
    set("montant", amount!=null?String(amount).replace(".",","):null);
    if(kind==="devis"){ set("entreprise",r.entreprise); if(!val(form,"libelle")) set("libelle",r.objet); }
    else if(!val(form,"libelle")) set("libelle",[r.entreprise,r.objet].filter(Boolean).join(" · "));
    set("date",r.date);
    if(isNew && r.theme && form.dataset.pickTheme==="1"){ const t=state.themes.find(t=>t.nom.toLowerCase()===String(r.theme).toLowerCase()); if(t) form.elements.themeId.value=t.id; }
    const found = [kind==="devis"&&r.entreprise?"l'entreprise":"", amount!=null?(r.montant_ttc!=null?"le montant TTC":"le montant HT (TTC introuvable)"):""].filter(Boolean).join(" et ");
    box.className = r.montant_ttc!=null?"scan ok":"scan warn";
    box.textContent = `J'ai repris ${found||"quelques informations"}. Vérifiez avant d'enregistrer.`;
  });
}

async function cycleEtape(id){

async function moveEtape(id,dir){
  const list = state.etapes.slice().sort(byOrder); const i=list.findIndex(y=>y.id===id); const j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  // renumber so every step has a distinct order, then swap
  const order = list.map(y=>y.id); [order[i],order[j]]=[order[j],order[i]];
  for(let k=0;k<order.length;k++){
    const y = state.etapes.find(z=>z.id===order[k]);
    if(y.ordre!==k+1){ const o=Object.assign({},y); delete o.id; o.ordre=k+1; try{ await save("etapes",y.id,o); }catch(_){ return; } }
  }
}

    return; }
  const el = ev.target.closest("[data-change=devis-statut]"); if(!el) return;
  const d = state.devis.find(x=>x.id===el.dataset.id); if(!d) return;
  if(el.value==="paye"||el.value==="partiel"){ formPaiement(d,el.value==="partiel"); return; }
  if(el.value===d.statut){ render(); return; }
  const obj = Object.assign({},d); delete obj.id; obj.statut = el.value;
  el.disabled = true;
  try{ await save("devis",d.id,obj); toast((d.entreprise||"Devis")+" : "+DEVIS_STATUT[el.value].label.toLowerCase()); }
  catch(e){ render(); }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape" && current) closeModal();
  if((ev.key==="Enter"||ev.key===" ") && ev.target.matches("[role=button][data-action]")){ ev.preventDefault(); ev.target.click(); }
});
function setTab(t){ tab = ["accueil","budget","depenses","travaux"].includes(t)?t:"accueil"; ls("mb-tab",tab); render(); window.scrollTo(0,0); }

/* ---------- boot ---------- */
try{ JSON.parse(ls("mb-open")||"[]").forEach(x=>open.add(x)); }catch(e){}
tab = (location.hash||"").slice(1) || ls("mb-tab") || "accueil";
if(!["accueil","budget","depenses","travaux"].includes(tab)) tab="accueil";
render();

/* ---------- compte, import, connexion ---------- */
function formMenu(){
  const email = session&&session.user?session.user.email:"";
  openModal("Compte",
    `<div class="hint">Connecté en tant que <b>${esc(email)}</b>.</div>
     <div class="field"><label>Importer les données de l'ancien outil</label>
     <div class="hint">À faire une seule fois, depuis un ordinateur : choisissez le fichier « maison-bouchon-migration.zip ».</div>
     <input type="file" id="f-zip" name="zip" accept=".zip,application/zip"></div>
     <div class="scan" id="f-scan" hidden></div>`,
    async f=>{ const z=f.elements.zip.files&&f.elements.zip.files[0]; if(!z) return fail(f,"Choisissez le fichier .zip."); return importZip(z,f); });
  document.getElementById("m-ok").textContent="Importer";
  const foot = document.querySelector(".f-actions");
  const out = document.createElement("button"); out.type="button"; out.className="btn danger"; out.textContent="Se déconnecter";
  out.addEventListener("click",async()=>{ await sb.auth.signOut(); location.reload(); });
  foot.prepend(out);
}
function loadScriptOnce(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const el=document.createElement("script"); el.src=src; el.onload=res; el.onerror=rej; document.head.appendChild(el); }); }
async function importZip(file,form){
  const box = form.querySelector("#f-scan"); box.hidden=false; box.className="scan"; box.textContent="Lecture de l'archive…";
  await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
  const zip = await JSZip.loadAsync(file);
  const j = zip.file("donnees.json"); if(!j) return fail(form,"Archive invalide : donnees.json manquant.");
  const rows = JSON.parse(await j.async("string"));
  const files = Object.values(zip.files).filter(z=>!z.dir && z.name.startsWith("fichiers/"));
  let n=0;
  for(const z of files){
    box.textContent=`Envoi des pièces jointes ${++n}/${files.length}…`;
    const blob = await z.async("blob");
    const path = "migration/"+z.name.slice("fichiers/".length);
    const {error} = await sb.storage.from("fichiers").upload(path,blob,{contentType:"application/pdf",upsert:true});
    if(error) return fail(form,"Échec de l'envoi de "+z.name+" : "+error.message);
  }
  box.textContent="Enregistrement des données…";
  for(let k=0;k<rows.length;k+=200){
    const {error} = await sb.from("docs").upsert(rows.slice(k,k+200));
    if(error) return fail(form,"Échec de l'import : "+error.message);
  }
  await loadAll();
}

async function loadAll(){
  const {data,error} = await sb.from("docs").select("coll,id,data");
  if(error){ offline = !navigator.onLine; toast("Chargement impossible."); return; }
  COLLS.forEach(c=>state[c]=[]); state.settings={};
  data.forEach(r=>applyRow(r.coll,r.id,r.data,false));
  state.ready=true; offline=false; render();
}
let channel=null;
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    if(p.eventType==="DELETE"){ const o=p.old||{}; if(o.coll) applyRow(o.coll,o.id,null,true); else { loadAll(); return; } }
    else { const n=p.new; applyRow(n.coll,n.id,n.data,false); }
    if(!current) render();
  }).subscribe();
}
function showLogin(msg){
  document.body.classList.add("logged-out");
  document.getElementById("app").innerHTML = `<section class="login panel">
    <span class="mark big" role="img" aria-label="Logo Maison Bouchon"></span>
    <h2>Connexion</h2><p class="hint">Utilisez le compte créé pour vous deux.</p>
    <form id="login" class="f" style="padding:0">
      <div class="field"><label for="l-mail">Adresse e-mail</label><input id="l-mail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pass">Mot de passe</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
      <div class="err" id="l-err" ${msg?"":"hidden"}>${esc(msg||"")}</div>
      <button class="btn primary" type="submit">Se connecter</button>
    </form></section>`;
  document.getElementById("login").addEventListener("submit",async ev=>{
    ev.preventDefault();
    const {error} = await sb.auth.signInWithPassword({email:document.getElementById("l-mail").value.trim(),password:document.getElementById("l-pass").value});
    if(error){ const e=document.getElementById("l-err"); e.textContent="E-mail ou mot de passe incorrect."; e.hidden=false; }
  });
}
async function start(){
  const cfg = window.MB_CONFIG||{};
  if(!cfg.supabaseUrl || /VOTRE/.test(cfg.supabaseUrl)){ document.getElementById("app").innerHTML=`<div class="banner">Configuration manquante : renseignez config.js.</div>`; return; }
  sb = window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data} = await sb.auth.getSession(); session = data.session;
  sb.auth.onAuthStateChange((ev,sess)=>{
    const had = !!session; session = sess;
    if(sess && !had){ document.body.classList.remove("logged-out"); state.ready=false; render(); loadAll(); subscribe(); }
    if(!sess && had) showLogin();
  });
  if(!session){ showLogin(); return; }
  document.body.classList.remove("logged-out");
  await loadAll(); subscribe();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && session) loadAll(); });
  window.addEventListener("online",()=>{ if(session){ loadAll(); subscribe(); } });
  window.addEventListener("offline",()=>{ offline=true; render(); });
}
start();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
